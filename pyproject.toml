[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chemical-score"
version = "0.3.0"
description = "Hierarchical and explainable rule-based chemical reaction scoring"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "rdkit>=2024.3.1",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
  "ruff>=0.9",
]

[tool.setuptools.packages.find]
include = ["chemical_score*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 88
